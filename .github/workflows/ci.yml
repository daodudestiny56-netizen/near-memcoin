name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Unit tests (game rules)
        run: npm test
      - name: Build wasm
        run: |
          npm run build > build.log 2>&1 || {
            # surface the failure as a public annotation (job logs need a login)
            echo "::error title=wasm build failed::$(grep -v 'no-unused-vars' build.log | head -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          tail -n 5 build.log
      - name: Report wasm size
        run: ls -l build/mira.wasm
      - name: Sandbox integration tests (real wasm on a local NEAR chain)
        run: |
          npm run test:sandbox > sandbox.log 2>&1 || {
            echo "::error title=sandbox tests failed::$(grep -v '^\s*$' sandbox.log | tail -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          tail -n 15 sandbox.log
      - uses: actions/upload-artifact@v4
        with:
          name: mira-wasm
          path: contract/build/mira.wasm
      - name: Commit the tested wasm (verifiable, deployable binary)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: .
        run: |
          mkdir -p contract/wasm
          cp contract/build/mira.wasm contract/wasm/mira.wasm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract/wasm/mira.wasm
          if git diff --cached --quiet; then
            echo "wasm unchanged"
          else
            git commit -m "chore(ci): update tested wasm for ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
