name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Unit tests (game rules)
        run: npm test
      - name: Build wasm
        run: npm run build
      - name: Report wasm size
        run: ls -l build/mira.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: mira-wasm
          path: contract/build/mira.wasm

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
